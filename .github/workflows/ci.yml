name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      commerce: ${{ steps.filter.outputs.commerce }}
      finance: ${{ steps.filter.outputs.finance }}
      gateway: ${{ steps.filter.outputs.gateway }}
      growth: ${{ steps.filter.outputs.growth }}
      logistics: ${{ steps.filter.outputs.logistics }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            commerce:
              - 'commerce-service/**'
            finance:
              - 'finance-service/**'
            gateway:
              - 'gateway-service/**'
            growth:
              - 'growth-service/**'
            logistics:
              - 'logistics-service/**'

  build-and-test:
    name: ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: commerce-service
            changed: ${{ needs.changes.outputs.commerce }}
          - service: finance-service
            changed: ${{ needs.changes.outputs.finance }}
          - service: gateway-service
            changed: ${{ needs.changes.outputs.gateway }}
          - service: growth-service
            changed: ${{ needs.changes.outputs.growth }}
          - service: logistics-service
            changed: ${{ needs.changes.outputs.logistics }}
    steps:
      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Type-check & build
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Test
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: npm test -- --ci

  ci-success:
    name: CI success
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "One or more services failed."
            exit 1
          fi

  docker-build-push:
    name: Push ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: commerce-service
            changed: ${{ needs.changes.outputs.commerce }}
            context: ./commerce-service
            dockerfile: ./commerce-service/Dockerfile
          - service: finance-service
            changed: ${{ needs.changes.outputs.finance }}
            context: ./finance-service
            dockerfile: ./finance-service/Dockerfile
          - service: gateway-service
            # Gateway's image embeds a static snapshot of every service's
            # API surface (see gateway-service/Dockerfile) — it must be
            # rebuilt whenever ANY service changes, not just its own.
            changed: >-
              ${{ needs.changes.outputs.gateway == 'true'
                || needs.changes.outputs.commerce == 'true'
                || needs.changes.outputs.finance == 'true'
                || needs.changes.outputs.growth == 'true'
                || needs.changes.outputs.logistics == 'true' }}
            context: .
            dockerfile: ./gateway-service/Dockerfile
          - service: growth-service
            changed: ${{ needs.changes.outputs.growth }}
            context: ./growth-service
            dockerfile: ./growth-service/Dockerfile
          - service: logistics-service
            changed: ${{ needs.changes.outputs.logistics }}
            context: ./logistics-service
            dockerfile: ./logistics-service/Dockerfile
    steps:
      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        if: matrix.changed == 'true'
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}/${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
