# Local dev environment shared by all 5 services.
#
# One Postgres server, ONE database, and a schema per service — deliberately
# the same shape as the hosted environment (a single free-tier Supabase
# database with DB_SCHEMA per service) rather than the database-per-service
# layout this used under MySQL. Local and deployed now fail in the same ways,
# which is the point: a cross-schema query that breaks in production should
# break on a laptop too.
#
# Ports are offset from Tecnogex's (3306/8765/8099) so both projects can run
# on this machine at the same time.
#
# Tables are NOT created by the services at boot. After `docker compose up`,
# apply migrations once from the host:
#   for s in gateway commerce logistics finance growth; do \
#     (cd $s-service && npm run db:migrate); done

networks:
  laundry_network_development:
    driver: bridge

services:
  postgres-development:
    container_name: laundry-postgres-development
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry_dev_root_pw}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: laundry_development
    ports:
      - '5442:5432'
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
      # Creates the five schemas up front. Prisma Migrate would create its own
      # on first run, but having them exist from the start means a service can
      # connect and report healthy before anyone has run a migration.
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d laundry_development"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - laundry_network_development

  # Shared by all 5 services for caching and for the rate limiter's counters.
  # `appendonly` is deliberately OFF: everything stored here is derived data
  # that can be rebuilt from Postgres, so paying for disk persistence buys
  # nothing — a cold Redis just means a brief spell of cache misses.
  # maxmemory-policy allkeys-lru so it evicts old keys under pressure instead
  # of refusing writes (the default `noeviction` would turn a full cache into
  # hard errors on every SET).
  redis:
    container_name: laundry-redis
    image: redis:7.4-alpine
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6390:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - laundry_network_development

  # Replaces phpMyAdmin, which only speaks MySQL. Same role: a browser UI for
  # poking at the data. Log in with the POSTGRES_* credentials above; the
  # server host inside pgAdmin is `postgres-development`, not localhost.
  pgadmin:
    container_name: laundry-pgadmin
    image: dpage/pgadmin4:8.12
    environment:
      # Must be a syntactically real address — pgAdmin validates it and
      # crash-loops on a `.local` TLD rather than starting with a warning.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@laundry.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-laundry_dev_root_pw}
      # Dev-only convenience: skips the master-password prompt on every open.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '8770:80'
    depends_on:
      - postgres-development
    restart: always
    networks:
      - laundry_network_development

  adminer:
    container_name: laundry-adminer
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres-development
    ports:
      - '8110:8080'
    depends_on:
      - postgres-development
    restart: always
    networks:
      - laundry_network_development

  gateway-service:
    container_name: laundry-gateway-service
    # Root build context (not ./gateway-service like the other 4 services)
    # — needed so the image can generate its aggregated OpenAPI snapshot
    # from every sibling service's source. See gateway-service/Dockerfile.
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    env_file: ./gateway-service/.env
    environment:
      NODE_ENV: development
      DB_HOST: postgres-development
      DB_PORT: '5432'
      DB_NAME: laundry_development
      DB_SCHEMA: gateway
      DB_SSL: 'false'
      REDIS_URL: redis://redis:6379
      COMMERCE_SERVICE_URL: http://commerce-service:5001
      LOGISTICS_SERVICE_URL: http://logistics-service:5002
      FINANCE_SERVICE_URL: http://finance-service:5003
      GROWTH_SERVICE_URL: http://growth-service:5004
    ports:
      - '5000:5000'
    depends_on:
      postgres-development:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  commerce-service:
    container_name: laundry-commerce-service
    build: ./commerce-service
    env_file: ./commerce-service/.env
    environment:
      DB_HOST: postgres-development
      DB_PORT: '5432'
      DB_NAME: laundry_development
      DB_SCHEMA: commerce
      DB_SSL: 'false'
      REDIS_URL: redis://redis:6379
    ports:
      - '5001:5001'
    depends_on:
      postgres-development:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  logistics-service:
    container_name: laundry-logistics-service
    build: ./logistics-service
    env_file: ./logistics-service/.env
    environment:
      DB_HOST: postgres-development
      DB_PORT: '5432'
      DB_NAME: laundry_development
      DB_SCHEMA: logistics
      DB_SSL: 'false'
      REDIS_URL: redis://redis:6379
    ports:
      - '5002:5002'
    depends_on:
      postgres-development:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  finance-service:
    container_name: laundry-finance-service
    build: ./finance-service
    env_file: ./finance-service/.env
    environment:
      DB_HOST: postgres-development
      DB_PORT: '5432'
      DB_NAME: laundry_development
      DB_SCHEMA: finance
      DB_SSL: 'false'
      REDIS_URL: redis://redis:6379
    ports:
      - '5003:5003'
    depends_on:
      postgres-development:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  growth-service:
    container_name: laundry-growth-service
    build: ./growth-service
    env_file: ./growth-service/.env
    environment:
      DB_HOST: postgres-development
      DB_PORT: '5432'
      DB_NAME: laundry_development
      DB_SCHEMA: growth
      DB_SSL: 'false'
      REDIS_URL: redis://redis:6379
    ports:
      - '5004:5004'
    depends_on:
      postgres-development:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

volumes:
  postgres-data-development:
