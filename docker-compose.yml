# Local dev environment shared by all 5 services — one MySQL server,
# one database per service (see mysql-init/001-create-databases.sql),
# plus phpMyAdmin/Adminer for browsing it. Mirrors the tecnogex_new_backend
# dev compose pattern. Ports are offset from Tecnogex's (3306/8765/8099)
# so both projects can run on this machine at the same time.

networks:
  laundry_network_development:
    driver: bridge

services:
  mysql-development:
    container_name: laundry-mysql-development
    image: mysql:8.0.30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laundry_dev_root_pw}
      MYSQL_DATABASE: gateway_service
    ports:
      - '3310:3306'
    volumes:
      - mysql-data-development:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 60s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - laundry_network_development

  phpmyadmin:
    container_name: laundry-phpmyadmin
    image: phpmyadmin/phpmyadmin:5.2.1
    environment:
      PMA_HOST: mysql-development
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laundry_dev_root_pw}
      PMA_PORT: 3306
    ports:
      - '8770:80'
    depends_on:
      - mysql-development
    restart: always
    networks:
      - laundry_network_development

  adminer:
    container_name: laundry-adminer
    image: adminer
    ports:
      - '8110:8080'
    depends_on:
      - mysql-development
    restart: always
    networks:
      - laundry_network_development

  gateway-service:
    container_name: laundry-gateway-service
    build: ./gateway-service
    env_file: ./gateway-service/.env
    environment:
      DB_HOST: mysql-development
      DB_PORT: '3306'
      COMMERCE_SERVICE_URL: http://commerce-service:5001
      LOGISTICS_SERVICE_URL: http://logistics-service:5002
      FINANCE_SERVICE_URL: http://finance-service:5003
      GROWTH_SERVICE_URL: http://growth-service:5004
    ports:
      - '5000:5000'
    depends_on:
      mysql-development:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  commerce-service:
    container_name: laundry-commerce-service
    build: ./commerce-service
    env_file: ./commerce-service/.env
    environment:
      DB_HOST: mysql-development
      DB_PORT: '3306'
    ports:
      - '5001:5001'
    depends_on:
      mysql-development:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  logistics-service:
    container_name: laundry-logistics-service
    build: ./logistics-service
    env_file: ./logistics-service/.env
    environment:
      DB_HOST: mysql-development
      DB_PORT: '3306'
    ports:
      - '5002:5002'
    depends_on:
      mysql-development:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  finance-service:
    container_name: laundry-finance-service
    build: ./finance-service
    env_file: ./finance-service/.env
    environment:
      DB_HOST: mysql-development
      DB_PORT: '3306'
    ports:
      - '5003:5003'
    depends_on:
      mysql-development:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

  growth-service:
    container_name: laundry-growth-service
    build: ./growth-service
    env_file: ./growth-service/.env
    environment:
      DB_HOST: mysql-development
      DB_PORT: '3306'
    ports:
      - '5004:5004'
    depends_on:
      mysql-development:
        condition: service_healthy
    restart: always
    networks:
      - laundry_network_development

volumes:
  mysql-data-development:
